<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Phaser View Export</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif;
    }

    body {
      margin: 0;
      padding: 12px;
      display: grid;
      gap: 10px;
      color: var(--figma-color-text);
      background: var(--figma-color-bg);
    }

    label {
      display: grid;
      gap: 3px;
      min-width: 0;
      font-size: 11px;
      color: var(--figma-color-text-secondary);
    }

    input {
      width: 100%;
      min-width: 0;
      box-sizing: border-box;
      border: 1px solid var(--figma-color-border);
      border-radius: 7px;
      padding: 6px 8px;
      background: var(--figma-color-bg);
      color: var(--figma-color-text);
      font: inherit;
    }

    button {
      border: 1px solid var(--figma-color-border);
      border-radius: 9px;
      padding: 9px 12px;
      cursor: pointer;
      background: var(--figma-color-bg);
      color: var(--figma-color-text);
      font: inherit;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #serverWarning {
      display: none;
      border-radius: 10px;
      padding: 12px;
      background: #b00020;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.35;
      box-shadow: 0 6px 18px rgb(176 0 32 / 28%);
    }

    #serverWarning.visible {
      display: block;
    }

    #serverWarningText {
      margin-top: 4px;
      font-size: 12px;
      font-weight: 500;
      opacity: 0.95;
      word-break: break-word;
    }

    .mainActions {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
    }

    #exportButton {
      width: 100%;
      padding: 13px 16px;
      border-color: #0a7cff;
      background: #0a7cff;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
    }

    #exportButton:disabled {
      border-color: var(--figma-color-border);
      background: var(--figma-color-bg-disabled);
      color: var(--figma-color-text-disabled);
    }

    #assetsButton {
      min-width: 96px;
      padding: 13px 14px;
      border-color: var(--figma-color-border);
      background: var(--figma-color-bg-secondary);
      color: var(--figma-color-text);
      font-size: 13px;
      font-weight: 700;
    }

    #assetsButton:disabled {
      background: var(--figma-color-bg-disabled);
      color: var(--figma-color-text-disabled);
    }

    .settingsGrid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .pathList {
      max-width: 100%;
      display: grid;
      gap: 3px;
      font-size: 10px;
      line-height: 1.3;
      color: var(--figma-color-text-secondary);
    }

    .pathListItem {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pathListName {
      font-weight: 700;
    }

    #log {
      min-height: 150px;
      max-height: 190px;
      overflow: auto;
      white-space: pre-wrap;
      border: 1px solid var(--figma-color-border);
      border-radius: 9px;
      padding: 10px;
      font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      background: var(--figma-color-bg-secondary);
    }
  </style>
</head>
<body>
  <div id="serverWarning" role="alert">
    Companion server не найден
    <div id="serverWarningText">Запустите server и проверьте serverUrl.</div>
  </div>

  <div class="mainActions">
    <button id="exportButton" type="button" disabled>Экспорт</button>
    <button id="assetsButton" type="button" disabled>Ассеты</button>
  </div>

  <div class="settingsGrid">
    <label>
      packName
      <input id="packNameInput" type="text" placeholder="assets-chibi-core-full" />
    </label>

    <label>
      atlasBasePath
      <input id="atlasBasePathInput" type="text" placeholder="./assets/atlases/" />
    </label>

    <label>
      serverUrl
      <input id="serverUrlInput" type="text" placeholder="http://localhost:3456" />
    </label>
  </div>

  <div class="pathList">
    <div id="atlasOutputDirItem" class="pathListItem" title="">
      - <span class="pathListName">atlasOutputDir:</span> <span id="atlasOutputDirValue">Путь atlas не задан</span>
    </div>
    <div id="tsOutputDirItem" class="pathListItem" title="">
      - <span class="pathListName">tsOutputDir:</span> <span id="tsOutputDirValue">Путь TS не задан</span>
    </div>
  </div>

  <div id="log">Инициализация...</div>

  <script>
    const DEFAULT_ATLAS_BASE_PATH = "./assets/atlases/";
    const DEFAULT_SERVER_URL = "http://localhost:3456";
    const DEFAULT_ATLAS_OUTPUT_DIR = "/Users/sergeytokarev/work_my/YOUR_GAME_PROJECT/public/assets/atlases";
    const DEFAULT_TS_OUTPUT_DIR = "/Users/sergeytokarev/work_my/YOUR_GAME_PROJECT/src/autogen";

    let isExporting = false;
    let isServerAvailable = false;
    let pendingExportToServer = false;
    let latestSelectionDiagnostic = null;
    let latestPageState = null;
    let settings = {
      packName: "",
      atlasBasePath: DEFAULT_ATLAS_BASE_PATH,
      serverUrl: DEFAULT_SERVER_URL,
      atlasOutputDir: DEFAULT_ATLAS_OUTPUT_DIR,
      tsOutputDir: DEFAULT_TS_OUTPUT_DIR,
    };

    const exportButton = document.getElementById("exportButton");
    const assetsButton = document.getElementById("assetsButton");
    const packNameInput = document.getElementById("packNameInput");
    const atlasBasePathInput = document.getElementById("atlasBasePathInput");
    const serverUrlInput = document.getElementById("serverUrlInput");
    const atlasOutputDirItem = document.getElementById("atlasOutputDirItem");
    const tsOutputDirItem = document.getElementById("tsOutputDirItem");
    const atlasOutputDirValue = document.getElementById("atlasOutputDirValue");
    const tsOutputDirValue = document.getElementById("tsOutputDirValue");
    const serverWarning = document.getElementById("serverWarning");
    const serverWarningText = document.getElementById("serverWarningText");
    const logNode = document.getElementById("log");
    const logLines = [];

    function postToPlugin(message) {
      parent.postMessage({ pluginMessage: message }, "*");
    }

    function appendLog(text, level = "info") {
      const timestamp = new Date().toLocaleTimeString();
      logLines.push(`[${timestamp}] ${level.toUpperCase()}: ${String(text || "")}`);
      if (logLines.length > 160) logLines.shift();
      logNode.textContent = logLines.join("\n");
      logNode.scrollTop = logNode.scrollHeight;
    }

    function showServerWarning(message) {
      serverWarning.classList.add("visible");
      serverWarningText.textContent = String(message || "Запустите server и проверьте serverUrl.");
    }

    function hideServerWarning() {
      serverWarning.classList.remove("visible");
      serverWarningText.textContent = "Запустите server и проверьте serverUrl.";
    }

    function slugify(input) {
      const value = String(input || "")
        .normalize("NFKD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-zA-Z0-9._-]+/g, "-")
        .replace(/-+/g, "-")
        .replace(/^-|-$/g, "")
        .toLowerCase();
      return value || "pack";
    }

    function normalizeServerUrl(input) {
      return String(input || "").trim().replace(/\/+$/g, "") || DEFAULT_SERVER_URL;
    }

    function normalizeAtlasBasePath(input) {
      const raw = String(input || "").trim();
      let next = (raw || DEFAULT_ATLAS_BASE_PATH).replace(/\\/g, "/");

      if (!next.startsWith("./") && !next.startsWith("../")) {
        next = next.startsWith("/") ? `.${next}` : `./${next}`;
      }

      if (!next.endsWith("/")) next += "/";
      return next;
    }

    function normalizeDirectoryPath(input) {
      return String(input || "").trim().replace(/\/+$/g, "");
    }

    function collectSettingsFromUi() {
      settings = {
        ...settings,
        packName: slugify(packNameInput.value || settings.packName || "pack"),
        atlasBasePath: normalizeAtlasBasePath(atlasBasePathInput.value),
        serverUrl: normalizeServerUrl(serverUrlInput.value),
        atlasOutputDir: normalizeDirectoryPath(settings.atlasOutputDir),
        tsOutputDir: normalizeDirectoryPath(settings.tsOutputDir),
      };
      renderSettings();
      return settings;
    }

    function renderPathValue(itemNode, valueNode, pathValue, emptyText) {
      const value = normalizeDirectoryPath(pathValue);
      valueNode.textContent = value || emptyText;
      itemNode.title = value || "";
    }

    function renderSettings() {
      packNameInput.value = settings.packName || "";
      atlasBasePathInput.value = settings.atlasBasePath || DEFAULT_ATLAS_BASE_PATH;
      serverUrlInput.value = settings.serverUrl || DEFAULT_SERVER_URL;
      renderPathValue(atlasOutputDirItem, atlasOutputDirValue, settings.atlasOutputDir, "Путь atlas не задан");
      renderPathValue(tsOutputDirItem, tsOutputDirValue, settings.tsOutputDir, "Путь TS не задан");
      updateExportButtonState();
      updateAssetsButtonState();
    }

    function updateExportButtonState() {
      const hasOutputPaths = Boolean(settings.atlasOutputDir && settings.tsOutputDir);
      exportButton.disabled = isExporting || !isServerAvailable || !hasOutputPaths;
    }

    function updateAssetsButtonState() {
      const scan = latestPageState && latestPageState.scan;
      assetsButton.disabled = Boolean(!scan || scan.hasAssetsFrames || isExporting);
    }

    function formatScanEntryLines(entries) {
      if (!entries || entries.length === 0) {
        return ["- не найдено"];
      }

      return entries.map((entry) => `- [${entry.type}] ${entry.path} (${entry.nodeId})`);
    }

    function formatPageScanDiagnostic(scan) {
      if (!scan) return "Скан страницы недоступен";
      return [
        `Скан страницы "${scan.pageName}": просмотрено узлов ${scan.scannedNodesCount}`,
        `Объекты view*: ${scan.viewNodes.length}`,
        ...formatScanEntryLines(scan.viewNodes),
        `Фреймы assets*: ${scan.assetsFrames.length}`,
        ...formatScanEntryLines(scan.assetsFrames),
      ].join("\n");
    }

    function handlePageState(pageState) {
      latestPageState = pageState || null;
      latestSelectionDiagnostic = latestPageState && latestPageState.selection;

      if (latestPageState && latestPageState.scan) {
        appendLog(formatPageScanDiagnostic(latestPageState.scan));
      }

      if (latestSelectionDiagnostic) {
        appendLog(latestSelectionDiagnostic.message, latestSelectionDiagnostic.ok ? "info" : "warn");
      }

      updateAssetsButtonState();
    }

    function savePluginSettings() {
      postToPlugin({
        type: "SAVE_SETTINGS",
        settings: collectSettingsFromUi(),
      });
    }

    async function fetchJson(url, options) {
      const response = await fetch(url, options);
      const text = await response.text();
      let payload = null;

      try {
        payload = text ? JSON.parse(text) : null;
      } catch (error) {
        payload = null;
      }

      if (!response.ok || !payload || payload.ok === false) {
        const message = payload && payload.error ? payload.error : text || `HTTP ${response.status}`;
        throw new Error(message);
      }

      return payload;
    }

    async function fetchServerSettings() {
      const serverUrl = normalizeServerUrl(serverUrlInput.value || settings.serverUrl);

      try {
        const payload = await fetchJson(`${serverUrl}/api/server/settings`);
        isServerAvailable = true;
        settings = {
          ...settings,
          ...payload.settings,
          serverUrl,
        };
        renderSettings();
        savePluginSettings();
        hideServerWarning();
        appendLog(`Server доступен: ${serverUrl}`);
      } catch (error) {
        isServerAvailable = false;
        const message = error instanceof Error ? error.message : String(error);
        showServerWarning(`${serverUrl}/api/server/settings недоступен. ${message}`);
        appendLog(`Server недоступен: ${message}`, "error");
        updateExportButtonState();
      }
    }

    async function saveServerSettings() {
      const nextSettings = collectSettingsFromUi();
      const payload = await fetchJson(`${nextSettings.serverUrl}/api/server/settings`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          atlasOutputDir: nextSettings.atlasOutputDir,
          tsOutputDir: nextSettings.tsOutputDir,
        }),
      });
      isServerAvailable = true;
      settings = { ...settings, ...payload.settings };
      renderSettings();
      hideServerWarning();
    }

    function toBase64FromBytes(bytes) {
      let binary = "";
      const chunkSize = 0x8000;
      for (let offset = 0; offset < bytes.length; offset += chunkSize) {
        const chunk = bytes.subarray(offset, offset + chunkSize);
        binary += String.fromCharCode(...chunk);
      }
      return btoa(binary);
    }

    async function exportPayloadToServer(exportPayload) {
      const nextSettings = collectSettingsFromUi();
      await saveServerSettings();
      appendLog(`Отправка в server: ${nextSettings.serverUrl}/api/figma/export`);

      try {
        const responseJson = await fetchJson(`${nextSettings.serverUrl}/api/figma/export`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            packName: nextSettings.packName,
            atlasBasePath: nextSettings.atlasBasePath,
            atlasOutputDir: nextSettings.atlasOutputDir,
            tsOutputDir: nextSettings.tsOutputDir,
            manifest: {
              ...exportPayload.manifest,
              packName: nextSettings.packName,
            },
            files: exportPayload.files.map((file) => ({
              fileName: file.fileName,
              bytesBase64: toBase64FromBytes(file.bytes),
            })),
          }),
        });

        hideServerWarning();
        appendLog(`Готово: записано файлов ${responseJson.filesWritten.length}`);
        appendLog(`Atlas: ${responseJson.atlasOutputDir}`);
        appendLog(`TS: ${responseJson.tsOutputDir}`);
        postToPlugin({ type: "EXPORT_DONE" });
      } catch (error) {
        const message = error instanceof Error ? error.message : String(error);
        isServerAvailable = false;
        showServerWarning(`${nextSettings.serverUrl}/api/figma/export недоступен. ${message}`);
        appendLog(`Ошибка записи файлов: ${message}`, "error");
        postToPlugin({ type: "EXPORT_ERROR", message });
      }
    }

    function startExport() {
      collectSettingsFromUi();
      if (!isServerAvailable) {
        appendLog("Экспорт заблокирован: server недоступен", "error");
        updateExportButtonState();
        return;
      }

      if (!settings.atlasOutputDir || !settings.tsOutputDir) {
        appendLog("Экспорт заблокирован: задайте atlasOutputDir и tsOutputDir", "error");
        updateExportButtonState();
        return;
      }

      isExporting = true;
      pendingExportToServer = true;
      updateExportButtonState();
      savePluginSettings();
      appendLog("Запуск полного экспорта");
      postToPlugin({ type: "EXPORT_TO_PROJECT" });
    }

    function createAssetsFrame() {
      const scan = latestPageState && latestPageState.scan;
      if (!scan || scan.hasAssetsFrames) {
        appendLog("Создание assets-core недоступно: assets* фрейм уже найден", "warn");
        updateAssetsButtonState();
        return;
      }

      assetsButton.disabled = true;
      appendLog("Создание фрейма assets-core");
      postToPlugin({ type: "CREATE_ASSETS_FRAME" });
    }

    window.onmessage = (event) => {
      const msg = event.data && event.data.pluginMessage;
      if (!msg || typeof msg !== "object") return;

      if (msg.type === "SETTINGS_LOADED") {
        settings = {
          ...settings,
          ...(msg.settings || {}),
        };
        renderSettings();
        appendLog("Настройки Figma загружены");
        fetchServerSettings();
        postToPlugin({ type: "GET_PAGE_STATE" });
        return;
      }

      if (msg.type === "SETTINGS_LOAD_FAILED" || msg.type === "SETTINGS_SAVE_FAILED") {
        appendLog(msg.message || "Ошибка настроек", "warn");
        return;
      }

      if (msg.type === "SELECTION_DIAGNOSTIC") {
        latestSelectionDiagnostic = msg.diagnostic || null;
        if (latestSelectionDiagnostic) {
          appendLog(latestSelectionDiagnostic.message, latestSelectionDiagnostic.ok ? "info" : "warn");
        }
        return;
      }

      if (msg.type === "PAGE_STATE") {
        handlePageState(msg.pageState);
        return;
      }

      if (msg.type === "ASSETS_FRAME_CREATED") {
        appendLog(`Фрейм создан: ${msg.frameName || "assets-core"}`);
        return;
      }

      if (msg.type === "ASSETS_FRAME_ALREADY_EXISTS") {
        appendLog("Фрейм assets* уже существует", "warn");
        updateAssetsButtonState();
        return;
      }

      if (msg.type === "ASSETS_FRAME_CREATE_FAILED") {
        appendLog(msg.message || "Не удалось создать assets-core", "error");
        updateAssetsButtonState();
        return;
      }

      if (msg.type === "EXPORT_PROGRESS") {
        const done = Number(msg.done || 0);
        const total = Number(msg.total || 0);
        const currentName = msg.currentName ? `: ${msg.currentName}` : "";
        appendLog(`Экспорт PNG ${done}/${total}${currentName}`);
        return;
      }

      if (msg.type === "EXPORT_READY") {
        const packName = slugify(settings.packName || msg.packName || "pack");
        settings.packName = packName;
        renderSettings();
        appendLog(`PNG экспорт готов: ${msg.files.length} файлов`);

        if (!pendingExportToServer) {
          isExporting = false;
          updateExportButtonState();
          updateAssetsButtonState();
          return;
        }

        exportPayloadToServer(msg).finally(() => {
          isExporting = false;
          pendingExportToServer = false;
          updateExportButtonState();
          updateAssetsButtonState();
        });
        return;
      }

      if (msg.type === "EXPORT_FAILED") {
        isExporting = false;
        pendingExportToServer = false;
        appendLog(msg.message || "Ошибка экспорта из Figma", "error");
        updateExportButtonState();
        updateAssetsButtonState();
        return;
      }

      if (msg.type === "LOG") {
        appendLog(String(msg.message || ""), msg.level || "info");
      }
    };

    exportButton.addEventListener("click", startExport);
    assetsButton.addEventListener("click", createAssetsFrame);

    [packNameInput, atlasBasePathInput, serverUrlInput].forEach((input) => {
      input.addEventListener("change", () => {
        collectSettingsFromUi();
        savePluginSettings();
        if (input === serverUrlInput) {
          fetchServerSettings();
          return;
        }
      });
    });

    renderSettings();
    appendLog("Плагин запущен. Автоэкспорт отключен.");
    postToPlugin({ type: "GET_SETTINGS" });
  </script>
</body>
</html>
