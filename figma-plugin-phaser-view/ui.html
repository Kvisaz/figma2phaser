<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Phaser View Export</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    label {
      display: grid;
      gap: 4px;
      font-size: 12px;
    }

    input {
      border: 1px solid #666;
      border-radius: 8px;
      padding: 6px 8px;
      min-width: 180px;
      background: transparent;
      color: inherit;
    }

    button {
      border: 1px solid #666;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      background: transparent;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      font-size: 12px;
      line-height: 1.4;
      white-space: pre-wrap;
      border: 1px solid #666;
      border-radius: 8px;
      padding: 10px;
      min-height: 140px;
      overflow: auto;
    }
  </style>
  <!--
    При showUI(__html__) относительные локальные script/src не гарантированно доступны.
    Поэтому JSZip подключаем абсолютным URL.
  -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>
  <div class="row">
    <label>
      packName
      <input id="packNameInput" type="text" placeholder="Например: atlas" />
    </label>
    <label>
      atlasBasePath
      <input
        id="atlasBasePathInput"
        type="text"
        value="./assets/atlases/"
        placeholder="./assets/atlases/"
      />
    </label>
  </div>

  <div class="row">
    <label>
      serverUrl
      <input
        id="serverUrlInput"
        type="text"
        value="http://localhost:3456"
        placeholder="http://localhost:3456"
      />
    </label>
  </div>

  <div class="row">
    <button id="syncToGame" disabled>Синхронизировать в игру</button>
    <button id="downloadZip" disabled>Скачать ZIP</button>
    <button id="retry">Повторить экспорт</button>
    <button id="close">Закрыть</button>
  </div>

  <div id="status">Ожидание данных из Figma…</div>
  <script>
    /**
     * Текущее состояние экспорта, пришедшее из code.js.
     */
    let exportPayload = null;
    const DEFAULT_ATLAS_BASE_PATH = "./assets/atlases/";
    const DEFAULT_SERVER_URL = "http://localhost:3456";

    const packNameInput = document.getElementById("packNameInput");
    const atlasBasePathInput = document.getElementById("atlasBasePathInput");
    const serverUrlInput = document.getElementById("serverUrlInput");
    const syncToGameButton = document.getElementById("syncToGame");
    const downloadZipButton = document.getElementById("downloadZip");
    const retryButton = document.getElementById("retry");
    const closeButton = document.getElementById("close");
    const statusNode = document.getElementById("status");
    atlasBasePathInput.value = DEFAULT_ATLAS_BASE_PATH;
    serverUrlInput.value = DEFAULT_SERVER_URL;
    let currentStatusText = "Ожидание данных из Figma…";
    const statusLogLines = [];

    /**
     * Настройки встроенного atlas-пэкера.
     * padding нужен, чтобы спрайты не прилипали друг к другу.
     */
    const ATLAS_PACKER_OPTIONS = Object.freeze({
      algorithm: "maxrects",
      padding: 2,
      minAtlasSize: 8,
      maxAtlasSize: 8192,
      powerOfTwo: false,
      allowTrim: true,
      alphaThreshold: 0,
      allowRotation: false,
      heuristics: [
        "bestShortSideFit",
        "bestLongSideFit",
        "bestAreaFit",
        "bottomLeft",
        "contactPoint",
      ],
    });

    /**
     * Безопасно отправляет сообщение в основной поток плагина.
     */
    function postToPlugin(message) {
      parent.postMessage({ pluginMessage: message }, "*");
    }

    /**
     * Пишет текст статуса в UI.
     */
    function setStatus(text) {
      currentStatusText = String(text || "");
      renderStatus();
    }

    /**
     * Добавляет строку в блок "Лог" внизу статуса.
     */
    function appendLog(text) {
      const value = String(text || "").trim();
      if (!value) return;
      statusLogLines.push(value);
      if (statusLogLines.length > 120) {
        statusLogLines.shift();
      }
      renderStatus();
    }

    /**
     * Рендерит основной статус и накопленный лог.
     */
    function renderStatus() {
      const base = currentStatusText || "";
      const logText = statusLogLines.length > 0
        ? `\n\nЛог:\n${statusLogLines.join("\n")}`
        : "";
      statusNode.textContent = `${base}${logText}`;
      statusNode.scrollTop = statusNode.scrollHeight;
    }

    /**
     * Достает предупреждения по исходным именам из manifest.
     */
    function getUnsafeNameWarningsFromPayload(payload) {
      if (!payload || !payload.manifest || !payload.manifest.warnings) return [];
      const warnings = payload.manifest.warnings.unsafeNames;
      return Array.isArray(warnings) ? warnings : [];
    }

    /**
     * Формирует читаемый список небезопасных имен для статуса UI.
     */
    function formatUnsafeNameWarningsForStatus(warnings) {
      return warnings.map((warning) => {
        const invalidCharacters = Array.isArray(warning.invalidCharacters)
          ? warning.invalidCharacters.map((char) => JSON.stringify(char)).join(", ")
          : "";
        const suffix = invalidCharacters ? ` (${invalidCharacters})` : "";
        return `- ${warning.role}: "${warning.name}" -> "${warning.safeName}"${suffix}`;
      }).join("\n");
    }

    /**
     * Диагностика состояния подключения JSZip.
     */
    function describeJsZipState() {
      const scriptSources = Array.from(document.scripts || [])
        .map((item) => item.getAttribute("src") || "<inline>")
        .join(", ");
      return `window.JSZip=${typeof window.JSZip}; globalThis.JSZip=${typeof globalThis.JSZip}; scripts=[${scriptSources}]`;
    }

    /**
     * Преобразует имя в безопасный slug для packName и файлов.
     */
    function slugify(input) {
      const value = String(input || "")
        .normalize("NFKD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-zA-Z0-9._-]+/g, "-")
        .replace(/-+/g, "-")
        .replace(/^-|-$/g, "")
        .toLowerCase();
      return value || "pack";
    }

    /**
     * Нормализует базовый путь atlas для генерации preload-конфига.
     * По требованию это должен быть относительный путь загрузки.
     */
    function normalizeAtlasBasePath(input) {
      const raw = String(input || "").trim();
      let next = (raw || DEFAULT_ATLAS_BASE_PATH).replace(/\\/g, "/");

      if (!next.startsWith("./") && !next.startsWith("../")) {
        if (next.startsWith("/")) {
          next = `.${next}`;
        } else {
          next = `./${next}`;
        }
      }

      if (!next.endsWith("/")) {
        next += "/";
      }

      return next;
    }

    /**
     * Собирает полный путь к atlas-файлу от базового пути и имени файла.
     */
    function buildAtlasFilePath(basePath, fileName) {
      const cleanFileName = String(fileName || "").replace(/^\/+/, "");
      return `${normalizeAtlasBasePath(basePath)}${cleanFileName}`;
    }

    /**
     * camelCase для генерации имен переменных.
     */
    function toCamelCase(input) {
      const safe = slugify(input);
      const tokens = safe
        .split(/[^a-zA-Z0-9]+/)
        .filter(Boolean)
        .map((token) => token.toLowerCase());

      if (tokens.length === 0) return "asset";
      const [first, ...rest] = tokens;
      const camel = first + rest.map((token) => token.charAt(0).toUpperCase() + token.slice(1)).join("");
      if (/^[0-9]/.test(camel)) return `n${camel}`;
      return camel;
    }

    /**
     * PascalCase для имен классов сцены.
     */
    function toPascalCase(input) {
      const camel = toCamelCase(input);
      return camel.charAt(0).toUpperCase() + camel.slice(1);
    }

    /**
     * Вычисляет padding nine-slice из имени узла/фрейма.
     * Формат: ...nine.20
     */
    function detectNinePadding(rawName) {
      const match = String(rawName || "").trim().match(/(?:^|[._-])nine\.(\d+)$/i);
      if (!match) return null;
      const parsed = Number(match[1]);
      if (!Number.isFinite(parsed)) return null;
      return parsed;
    }

    /**
     * Скачивает Blob как файл.
     */
    function downloadBlob(blob, fileName) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = fileName;
      a.click();
      URL.revokeObjectURL(url);
    }

    /**
     * Преобразует Uint8Array PNG в объект изображения для Canvas.
     */
    async function bytesToDrawableImage(bytes) {
      const blob = new Blob([bytes], { type: "image/png" });

      if (typeof createImageBitmap === "function") {
        const bitmap = await createImageBitmap(blob);
        return {
          width: bitmap.width,
          height: bitmap.height,
          drawable: bitmap,
          dispose: () => {
            if (typeof bitmap.close === "function") bitmap.close();
          },
        };
      }

      // Фоллбек для сред без createImageBitmap.
      const image = await new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error("Failed to decode PNG"));
        img.src = URL.createObjectURL(blob);
      });

      return {
        width: image.width,
        height: image.height,
        drawable: image,
        dispose: () => {
          if (image.src && image.src.startsWith("blob:")) {
            URL.revokeObjectURL(image.src);
          }
        },
      };
    }

    /**
     * Переводит число в следующую степень двойки.
     * Это совместимо с типичными ожиданиями atlas-текстур.
     */
    function nextPow2(value) {
      let result = 1;
      const safe = Math.max(1, Math.ceil(value));
      while (result < safe) result *= 2;
      return result;
    }

    /**
     * Оценивает разумную ширину atlas по суммарной площади изображений.
     */
    function estimateAtlasWidth(images, padding) {
      const area = images.reduce((sum, item) => sum + item.width * item.height, 0);
      const widest = images.reduce((max, item) => Math.max(max, item.width), 1);
      const target = Math.sqrt(area);
      const guessed = Math.max(target * 1.4, widest + padding * 2);
      return nextPow2(guessed);
    }

    /**
     * Простой shelf-пэкер: раскладывает изображения по строкам слева направо.
     *
     * Плюсы:
     * - очень простой и надежный;
     * - предсказуемый результат.
     *
     * Минусы:
     * - не самый плотный packing.
     */
    function packImagesShelf(images, options) {
      const padding = options.padding;
      const minAtlasSize = options.minAtlasSize;

      // Сортировка по высоте обычно дает более компактный результат для shelf-алгоритма.
      const sorted = [...images].sort((a, b) => b.height - a.height);

      let maxRowWidth = estimateAtlasWidth(sorted, padding);
      const requiredMinWidth = sorted.reduce((max, item) => Math.max(max, item.width + padding * 2), 1);
      maxRowWidth = Math.max(maxRowWidth, nextPow2(requiredMinWidth));

      let x = padding;
      let y = padding;
      let rowHeight = 0;
      let usedMaxX = minAtlasSize;
      let usedMaxY = minAtlasSize;

      const placements = [];

      sorted.forEach((item) => {
        // Если элемент не влезает в текущую строку, переходим на новую.
        if (x + item.width + padding > maxRowWidth && rowHeight > 0) {
          x = padding;
          y += rowHeight + padding;
          rowHeight = 0;
        }

        placements.push({
          ...item,
          atlasX: x,
          atlasY: y,
          frameWidth: item.width,
          frameHeight: item.height,
          packedWidth: item.width + padding,
          packedHeight: item.height + padding,
          rotated: false,
        });

        x += item.width + padding;
        rowHeight = Math.max(rowHeight, item.height);
        usedMaxX = Math.max(usedMaxX, x);
        usedMaxY = Math.max(usedMaxY, y + rowHeight + padding);
      });

      const atlasWidth = nextPow2(Math.max(minAtlasSize, usedMaxX));
      const atlasHeight = nextPow2(Math.max(minAtlasSize, usedMaxY));

      return {
        atlasWidth,
        atlasHeight,
        algorithm: "shelf",
        placements,
      };
    }

    /**
     * Выбирает алгоритм упаковки и оставляет shelf как fallback.
     */
    function packImagesForAtlas(images, options) {
      const algorithm = String(options.algorithm || "maxrects").toLowerCase();

      if (algorithm === "maxrects") {
        try {
          return packImagesMaxRects(images, options);
        } catch (error) {
          const fallback = packImagesShelf(images, options);
          const message = error instanceof Error ? error.message : String(error);
          return {
            ...fallback,
            fallbackReason: message,
          };
        }
      }

      return packImagesShelf(images, options);
    }

    /**
     * MaxRects-пэкер: перебирает размеры atlas и эвристики, затем выбирает лучший результат.
     */
    function packImagesMaxRects(images, options) {
      const minAtlasSize = options.minAtlasSize;
      if (images.length === 0) {
        return {
          atlasWidth: minAtlasSize,
          atlasHeight: minAtlasSize,
          algorithm: "maxrects",
          heuristic: "none",
          placements: [],
        };
      }

      const sortedImages = sortImagesForPacking(images);
      const candidates = generateAtlasSizeCandidates(sortedImages, options);
      const heuristics = getMaxRectsHeuristics(options);
      let bestResult = null;

      candidates.forEach((candidate) => {
        heuristics.forEach((heuristic) => {
          const packResult = tryPackImagesIntoSize(
            sortedImages,
            candidate.width,
            candidate.height,
            options,
            heuristic,
          );

          if (!packResult) return;

          const normalizedResult = shrinkPackResultToUsedBounds({
            ...packResult,
            algorithm: "maxrects",
            heuristic,
          }, options);

          if (!bestResult || isBetterPackResult(normalizedResult, bestResult)) {
            bestResult = normalizedResult;
          }
        });
      });

      if (bestResult) return bestResult;

      throw new Error(`MaxRects не смог упаковать ${images.length} PNG до ${options.maxAtlasSize}x${options.maxAtlasSize}`);
    }

    /**
     * Возвращает список эвристик MaxRects, с которыми стоит попробовать packing.
     */
    function getMaxRectsHeuristics(options) {
      if (Array.isArray(options.heuristics) && options.heuristics.length > 0) {
        return options.heuristics;
      }

      return ["bestShortSideFit"];
    }

    /**
     * Сначала кладем крупные и сложные прямоугольники, чтобы они не остались без места.
     */
    function sortImagesForPacking(images) {
      return [...images].sort((a, b) => {
        const aLongSide = Math.max(a.width, a.height);
        const bLongSide = Math.max(b.width, b.height);
        const aArea = a.width * a.height;
        const bArea = b.width * b.height;

        if (aLongSide !== bLongSide) return bLongSide - aLongSide;
        if (aArea !== bArea) return bArea - aArea;
        if (a.height !== b.height) return b.height - a.height;
        return String(a.fileName).localeCompare(String(b.fileName));
      });
    }

    /**
     * Генерирует размеры atlas. Площадь важнее квадратности, квадратность только tie-breaker.
     */
    function generateAtlasSizeCandidates(images, options) {
      const padding = options.padding;
      const minAtlasSize = options.minAtlasSize;
      const maxAtlasSize = options.maxAtlasSize;
      const widest = images.reduce((max, item) => {
        const requiredWidth = options.allowRotation
          ? Math.min(item.width, item.height) + padding * 2
          : item.width + padding * 2;
        return Math.max(max, requiredWidth);
      }, minAtlasSize);
      const tallest = images.reduce((max, item) => {
        const requiredHeight = options.allowRotation
          ? Math.min(item.width, item.height) + padding * 2
          : item.height + padding * 2;
        return Math.max(max, requiredHeight);
      }, minAtlasSize);
      const minWidth = nextPow2(Math.max(minAtlasSize, widest));
      const minHeight = nextPow2(Math.max(minAtlasSize, tallest));
      const requiredArea = images.reduce((sum, item) => {
        return sum + (item.width + padding) * (item.height + padding);
      }, 0);
      const candidates = [];

      for (let width = minWidth; width <= maxAtlasSize; width = getNextAtlasCandidateSize(width, options)) {
        for (let height = minHeight; height <= maxAtlasSize; height = getNextAtlasCandidateSize(height, options)) {
          if (width * height < requiredArea) continue;
          candidates.push({ width, height });
        }
      }

      candidates.sort((a, b) => {
        const aArea = a.width * a.height;
        const bArea = b.width * b.height;
        const aMaxSide = Math.max(a.width, a.height);
        const bMaxSide = Math.max(b.width, b.height);
        const aAspectDelta = Math.abs(a.width - a.height);
        const bAspectDelta = Math.abs(b.width - b.height);

        if (aArea !== bArea) return aArea - bArea;
        if (aAspectDelta !== bAspectDelta) return aAspectDelta - bAspectDelta;
        if (aMaxSide !== bMaxSide) return aMaxSide - bMaxSide;
        return a.height - b.height;
      });

      return candidates;
    }

    /**
     * Возвращает следующий допустимый размер atlas.
     *
     * Для non-POT atlas нельзя идти с мелким шагом до maxAtlasSize:
     * это превращает packing в десятки тысяч попыток width/height/heuristic.
     * Адаптивный шаг оставляет плотный поиск на малых размерах и быстро
     * разрежает кандидаты на больших atlas.
     *
     * Если снова нужно ускорять:
     * - увеличивать пороги шагов ниже;
     * - уменьшать maxAtlasSize;
     * - сокращать список ATLAS_PACKER_OPTIONS.heuristics.
     */
    function getNextAtlasCandidateSize(value, options) {
      if (options.powerOfTwo !== false) return value * 2;
      if (value < 512) return value + 64;
      if (value < 1024) return value + 128;
      if (value < 2048) return value + 256;
      if (value < 4096) return value + 512;
      return value + 1024;
    }

    /**
     * Пытается упаковать весь набор в конкретный размер atlas и одной эвристикой.
     */
    function tryPackImagesIntoSize(images, atlasWidth, atlasHeight, options, heuristic) {
      const padding = options.padding;
      let freeRects = [createInitialFreeRect(atlasWidth, atlasHeight, padding)];
      const placements = [];

      for (let index = 0; index < images.length; index += 1) {
        const image = images[index];
        const placement = findBestMaxRectsPlacement(
          freeRects,
          placements,
          image,
          options,
          heuristic,
          atlasWidth,
          atlasHeight,
        );

        if (!placement) {
          return null;
        }

        placements.push(createPlacedImage(image, placement));
        freeRects = splitFreeRects(freeRects, createUsedRectFromPlacement(placement));
        freeRects = pruneContainedFreeRects(freeRects);
      }

      return {
        atlasWidth,
        atlasHeight,
        placements,
      };
    }

    /**
     * Оставляет внешний padding по левому и верхнему краю atlas.
     */
    function createInitialFreeRect(atlasWidth, atlasHeight, padding) {
      return {
        x: padding,
        y: padding,
        width: Math.max(0, atlasWidth - padding),
        height: Math.max(0, atlasHeight - padding),
      };
    }

    /**
     * Ищет лучшее место для одного изображения по выбранной эвристике.
     */
    function findBestMaxRectsPlacement(freeRects, placements, image, options, heuristic, atlasWidth, atlasHeight) {
      const padding = options.padding;
      const variants = createPackingVariants(image, padding, options.allowRotation);
      let best = null;

      freeRects.forEach((freeRect) => {
        variants.forEach((variant) => {
          if (variant.packedWidth > freeRect.width || variant.packedHeight > freeRect.height) return;

          const candidate = {
            ...variant,
            x: freeRect.x,
            y: freeRect.y,
          };

          candidate.score = scoreMaxRectsCandidate(
            heuristic,
            candidate,
            freeRect,
            placements,
            atlasWidth,
            atlasHeight,
            padding,
          );

          if (!best || isBetterMaxRectsPlacement(candidate, best)) {
            best = candidate;
          }
        });
      });

      return best;
    }

    /**
     * Возвращает normal/rotated варианты одного изображения.
     */
    function createPackingVariants(image, padding, allowRotation) {
      const variants = [
        {
          rotated: false,
          frameWidth: image.width,
          frameHeight: image.height,
          packedWidth: image.width + padding,
          packedHeight: image.height + padding,
        },
      ];

      if (allowRotation && image.width !== image.height) {
        variants.push({
          rotated: true,
          frameWidth: image.height,
          frameHeight: image.width,
          packedWidth: image.height + padding,
          packedHeight: image.width + padding,
        });
      }

      return variants;
    }

    /**
     * Считает score кандидата для конкретной эвристики MaxRects.
     */
    function scoreMaxRectsCandidate(heuristic, candidate, freeRect, placements, atlasWidth, atlasHeight, padding) {
      const leftoverWidth = freeRect.width - candidate.packedWidth;
      const leftoverHeight = freeRect.height - candidate.packedHeight;
      const shortSideFit = Math.min(leftoverWidth, leftoverHeight);
      const longSideFit = Math.max(leftoverWidth, leftoverHeight);
      const areaFit = freeRect.width * freeRect.height - candidate.packedWidth * candidate.packedHeight;
      const bottom = candidate.y + candidate.packedHeight;
      const contactScore = calculateContactPointScore(
        createUsedRectFromPlacement(candidate),
        placements,
        atlasWidth,
        atlasHeight,
        padding,
      );

      if (heuristic === "bestLongSideFit") {
        return [longSideFit, shortSideFit, areaFit, candidate.y, candidate.x];
      }

      if (heuristic === "bestAreaFit") {
        return [areaFit, shortSideFit, longSideFit, candidate.y, candidate.x];
      }

      if (heuristic === "bottomLeft") {
        return [bottom, candidate.x, shortSideFit, areaFit];
      }

      if (heuristic === "contactPoint") {
        return [-contactScore, bottom, candidate.x, areaFit];
      }

      return [shortSideFit, longSideFit, areaFit, candidate.y, candidate.x];
    }

    /**
     * Сравнивает кандидатов MaxRects детерминированно.
     */
    function isBetterMaxRectsPlacement(candidate, best) {
      const scoreComparison = compareNumberArrays(candidate.score, best.score);
      if (scoreComparison !== 0) return scoreComparison < 0;
      if (candidate.rotated !== best.rotated) return !candidate.rotated;
      if (candidate.y !== best.y) return candidate.y < best.y;
      return candidate.x < best.x;
    }

    /**

export const ${packCamel}AutoAssets: AutoAssetMap = ${packCamel}AutoAssetsConfig.images;
export const ${packCamel}AutoAtlas = ${packCamel}AutoAssetsConfig.preload.atlases[0];

// Экспортируем pack-specific preload, чтобы сцена/игра могла подгружать atlas одной функцией.
export function ${preloadFunctionName}(scene: Phaser.Scene): void {
  ${packCamel}AutoAssetsConfig.preload.atlases.forEach((atlas) => {
    if (scene.textures.exists(atlas.pngUrl)) return;
    scene.load.atlas(atlas.pngUrl, atlas.pngUrl, atlas.jsonUrl);
  });
}
`;

      const sceneTs = `// This file is auto-generated by figma2assets plugin. Do not edit manually.
import { addAssetImage, addAssetNine } from "./utils";
import { ${packCamel}AutoAssets, ${packCamel}AutoAssetOrder, AutoAssetName, ${preloadFunctionName} } from "./${packName}-assets";

export class ${sceneClassName} extends Phaser.Scene {
  constructor() {
    super({ key: "${sceneKey}" });
  }

  preload(): void {
    ${preloadFunctionName}(this);
  }

  create(): void {
    ${packCamel}AutoAssetOrder.forEach((assetName: AutoAssetName) => {
      const asset = ${packCamel}AutoAssets[assetName];
      if (asset.kind === "nine") {
        addAssetNine({ scene: this, asset });
        return;
      }
      addAssetImage({ scene: this, asset });
    });
  }
}
`;

      return {
        typesTs,
        utilsTs,
        assetsTs,
        sceneTs,
      };
    }

    function normalizeServerUrl(input) {
      const value = String(input || "").trim();
      return value || DEFAULT_SERVER_URL;
    }

    function toBase64FromBytes(bytes) {
      let binary = "";
      const chunkSize = 0x8000;
      for (let offset = 0; offset < bytes.length; offset += chunkSize) {
        const chunk = bytes.subarray(offset, offset + chunkSize);
        binary += String.fromCharCode(...chunk);
      }
      return btoa(binary);
    }

    async function postToCompanionServer(props) {
      const { serverUrl, packName, payload, atlasPngBytes, atlasJson, sceneSources, atlasBasePath } = props;

      const requestBody = {
        packName,
        atlasBasePath,
        manifest: {
          ...payload.manifest,
          packName,
        },
        files: payload.files.map((file) => ({
          fileName: file.fileName,
          bytesBase64: toBase64FromBytes(file.bytes),
        })),
        atlas: {
          pngFileName: `${packName}.png`,
          jsonFileName: `${packName}.json`,
          pngBytesBase64: toBase64FromBytes(atlasPngBytes),
          json: atlasJson,
        },
        sceneSources,
      };

      const response = await fetch(`${normalizeServerUrl(serverUrl)}/export`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify(requestBody),
      });

      const responseText = await response.text();
      let responseJson = null;

      try {
        responseJson = responseText ? JSON.parse(responseText) : null;
      } catch (error) {
        responseJson = null;
      }

      if (!response.ok) {
        const serverMessage = responseJson && responseJson.error
          ? responseJson.error
          : responseText || `HTTP ${response.status}`;
        throw new Error(`Companion server error: ${serverMessage}`);
      }

      return responseJson;
    }

    /**
     * Собирает весь ZIP-архив в нужной структуре папок.
     */
    async function buildZipArchive(props) {
      const { packName, payload, atlasPngBytes, atlasJson, sceneSources } = props;
      const JSZipCtor = window.JSZip || globalThis.JSZip;
      if (!JSZipCtor) {
        throw new Error(`JSZip is not available. ${describeJsZipState()}`);
      }

      const zip = new JSZipCtor();

      // 1) Исходные PNG по верхним детям узла.
      const pngFolder = zip.folder("png") || zip;
      payload.files.forEach((file) => {
        pngFolder.file(file.fileName, file.bytes);
      });

      // 2) Manifest в корне ZIP.
      const manifestForZip = {
        ...payload.manifest,
        packName,
      };
      zip.file("manifest.json", JSON.stringify(manifestForZip, null, 2));

      // 3) Phaser atlas файлы.
      const phaserFolder = zip.folder("phaser") || zip;
      const atlasFolder = phaserFolder.folder("atlases") || phaserFolder;
      atlasFolder.file(`${packName}.png`, atlasPngBytes);
      atlasFolder.file(`${packName}.json`, JSON.stringify(atlasJson, null, 2));

      // 4) Phaser scene файлы.
      const sceneFolder = phaserFolder.folder("scene") || phaserFolder;
      sceneFolder.file(`${packName}-scene.ts`, sceneSources.sceneTs);
      sceneFolder.file(`${packName}-assets.ts`, sceneSources.assetsTs);
      sceneFolder.file("utils.ts", sceneSources.utilsTs);
      sceneFolder.file("types.ts", sceneSources.typesTs);

      const blob = await zip.generateAsync({ type: "blob", compression: "DEFLATE" });
      return blob;
    }

    /**
     * Готовит atlas + JSON + TS-исходники один раз, чтобы потом либо скачать ZIP,
     * либо отправить результат в локальный companion server.
     */
    async function prepareGeneratedArtifacts() {
      if (!exportPayload) {
        throw new Error("Нет данных экспорта. Сначала выполните экспорт из Figma.");
      }

      const packName = slugify(packNameInput.value || exportPayload.packName || "pack");
      const atlasBasePath = normalizeAtlasBasePath(atlasBasePathInput.value || DEFAULT_ATLAS_BASE_PATH);
      packNameInput.value = packName;
      atlasBasePathInput.value = atlasBasePath;

      let preparedImages = [];

      try {
        preparedImages = await prepareImagesForPacking(exportPayload.files, ATLAS_PACKER_OPTIONS);
        const trimStats = calculateTrimStats(preparedImages);

        setStatus(`Упаковка atlas (${ATLAS_PACKER_OPTIONS.algorithm})…`);
        const packResult = packImagesForAtlas(preparedImages, ATLAS_PACKER_OPTIONS);
        if (packResult.fallbackReason) {
          appendLog(`WARN: MaxRects fallback to shelf: ${packResult.fallbackReason}`);
        }
        const atlasUsage = calculateAtlasUsage(packResult);
        const rotatedCount = countRotatedPlacements(packResult);

        setStatus(
          `Рендер atlas PNG…
` +
          `Пэкер: ${packResult.algorithm}
` +
          `Эвристика: ${packResult.heuristic || "n/a"}
` +
          `Размер atlas: ${packResult.atlasWidth}x${packResult.atlasHeight}
` +
          `Frames: ${packResult.placements.length}
` +
          `Rotated: ${rotatedCount}
` +
          `Trimmed: ${trimStats.trimmedCount}, saved ${formatPercent(trimStats.savedRatio)}
` +
          `Заполнение: ${formatAtlasUsagePercent(atlasUsage)}`,
        );
        const atlasPngBytes = await renderAtlasPng(packResult);

        setStatus("Формирование atlas JSON…");
        const atlasJson = buildPhaserAtlasJson({ packName, packResult });

        setStatus("Генерация Phaser scene файлов…");
        const sceneSources = buildPhaserSceneSources({
          packName,
          manifest: exportPayload.manifest,
          atlasBasePath,
        });

        return {
          packName,
          atlasBasePath,
          atlasJson,
          atlasPngBytes,
          sceneSources,
          preparedImages,
        };
      } catch (error) {
        disposePreparedImages(preparedImages);
        throw error;
      }
    }

    /**
     * Полный сценарий: atlas pack + генерация TS + ZIP.
     */
    async function downloadZip() {
      if (!exportPayload) {
        setStatus("Нет данных для скачивания. Сначала выполните экспорт.");
        return;
      }

      downloadZipButton.disabled = true;
      syncToGameButton.disabled = true;
      const generationStartedAt = Date.now();
      let preparedImages = [];

      try {
        const artifacts = await prepareGeneratedArtifacts();
        preparedImages = artifacts.preparedImages;

        setStatus("Сборка ZIP структуры…");
        const zipBlob = await buildZipArchive({
          packName: artifacts.packName,
          payload: exportPayload,
          atlasPngBytes: artifacts.atlasPngBytes,
          atlasJson: artifacts.atlasJson,
          sceneSources: artifacts.sceneSources,
        });

        downloadBlob(zipBlob, `${artifacts.packName}.zip`);
        const generationDurationText = formatDuration(Date.now() - generationStartedAt);
        appendLog(`Генерация заняла время: ${generationDurationText}`);
        setStatus(
          `Готово. Скачан архив ${artifacts.packName}.zip
` +
          `Генерация заняла время: ${generationDurationText}`,
        );

        postToPlugin({ type: "EXPORT_DONE" });
      } catch (error) {
        const message = error instanceof Error ? error.message : String(error);
        const generationDurationText = formatDuration(Date.now() - generationStartedAt);
        appendLog(`Генерация прервалась через: ${generationDurationText}`);
        setStatus(
          `Ошибка при создании ZIP:
${message}

` +
          `Генерация прервалась через: ${generationDurationText}`,
        );
        postToPlugin({ type: "EXPORT_ERROR", message });
      } finally {
        disposePreparedImages(preparedImages);
        downloadZipButton.disabled = false;
        syncToGameButton.disabled = false;
      }
    }

    async function syncToGame() {
      if (!exportPayload) {
        setStatus("Нет данных для синхронизации. Сначала выполните экспорт.");
        return;
      }

      downloadZipButton.disabled = true;
      syncToGameButton.disabled = true;
      const generationStartedAt = Date.now();
      let preparedImages = [];

      try {
        const artifacts = await prepareGeneratedArtifacts();
        preparedImages = artifacts.preparedImages;
        const serverUrl = normalizeServerUrl(serverUrlInput.value);
        serverUrlInput.value = serverUrl;

        setStatus(`Отправка в companion server…
${serverUrl}`);
        const responseJson = await postToCompanionServer({
          serverUrl,
          packName: artifacts.packName,
          payload: exportPayload,
          atlasPngBytes: artifacts.atlasPngBytes,
          atlasJson: artifacts.atlasJson,
          sceneSources: artifacts.sceneSources,
          atlasBasePath: artifacts.atlasBasePath,
        });

        const generationDurationText = formatDuration(Date.now() - generationStartedAt);
        appendLog(`Синхронизация заняла время: ${generationDurationText}`);
        setStatus(
          `Готово. Файлы записаны в игру.
` +
          `Pack: ${artifacts.packName}
` +
          `Server: ${serverUrl}
` +
          `Atlas dir: ${responseJson && responseJson.atlasOutputDir ? responseJson.atlasOutputDir : "n/a"}
` +
          `Scene dir: ${responseJson && responseJson.sceneOutputDir ? responseJson.sceneOutputDir : "n/a"}
` +
          `Синхронизация заняла время: ${generationDurationText}`,
        );

        postToPlugin({ type: "EXPORT_DONE" });
      } catch (error) {
        const message = error instanceof Error ? error.message : String(error);
        const generationDurationText = formatDuration(Date.now() - generationStartedAt);
        appendLog(`Синхронизация прервалась через: ${generationDurationText}`);
        setStatus(
          `Ошибка синхронизации:
${message}

` +
          `Синхронизация прервалась через: ${generationDurationText}`,
        );
        postToPlugin({ type: "EXPORT_ERROR", message });
      } finally {
        disposePreparedImages(preparedImages);
        downloadZipButton.disabled = false;
        syncToGameButton.disabled = false;
      }
    }

    /**
     * Слушает сообщения от code.js.
     */
    window.onmessage = (event) => {
      const msg = event.data && event.data.pluginMessage;
      if (!msg || typeof msg !== "object") return;

      if (msg.type === "EXPORT_PROGRESS") {
        const done = Number(msg.done || 0);
        const total = Number(msg.total || 0);
        const currentName = msg.currentName ? `\nТекущий узел: ${msg.currentName}` : "";
        setStatus(`Экспорт PNG… ${done}/${total}${currentName}`);
        return;
      }

      if (msg.type === "EXPORT_READY") {
        exportPayload = msg;
        packNameInput.value = slugify(msg.packName || "pack");
        downloadZipButton.disabled = false;
        syncToGameButton.disabled = false;
        const unsafeNameWarnings = getUnsafeNameWarningsFromPayload(msg);
        const unsafeNameWarningText = unsafeNameWarnings.length > 0
          ? `\n\nПредупреждения по именам:\n${formatUnsafeNameWarningsForStatus(unsafeNameWarnings)}`
          : "";
        setStatus(
          `Экспорт завершен.\n` +
          `Pack: ${packNameInput.value}\n` +
          `Atlas base path: ${normalizeAtlasBasePath(atlasBasePathInput.value)}\n` +
          `PNG файлов: ${msg.files.length}\n` +
          `Нажмите \"Скачать ZIP\".` +
          unsafeNameWarningText,
        );
        return;
      }

      if (msg.type === "EXPORT_FAILED") {
        downloadZipButton.disabled = true;
        setStatus(`Ошибка экспорта:\n${msg.message || "Неизвестная ошибка"}`);
        appendLog(`ERROR: ${msg.message || "Неизвестная ошибка"}`);
        return;
      }

      if (msg.type === "LOG") {
        const level = String(msg.level || "info").toUpperCase();
        const at = msg.atIso ? `[${msg.atIso}] ` : "";
        appendLog(`${at}${level}: ${String(msg.message || "")}`);
      }
    };

    // Кнопки управления UI.
    syncToGameButton.addEventListener("click", () => {
      syncToGame();
    });

    downloadZipButton.addEventListener("click", () => {
      downloadZip();
    });

    retryButton.addEventListener("click", () => {
      downloadZipButton.disabled = true;
      setStatus("Повторный запуск экспорта…");
      postToPlugin({ type: "RETRY_EXPORT" });
    });

    closeButton.addEventListener("click", () => {
      postToPlugin({ type: "CLOSE" });
    });
  </script>
</body>
