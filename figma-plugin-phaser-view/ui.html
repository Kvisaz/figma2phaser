<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Phaser View Export</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 12px;
      display: grid;
      gap: 12px;
    }

    .section {
      display: grid;
      gap: 8px;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    label {
      display: grid;
      gap: 4px;
      font-size: 12px;
    }

    input {
      border: 1px solid #666;
      border-radius: 8px;
      padding: 6px 8px;
      min-width: 220px;
      background: transparent;
      color: inherit;
    }

    button {
      border: 1px solid #666;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      background: transparent;
      color: inherit;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .pathBlock {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .pathPreview {
      max-width: 480px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 11px;
      line-height: 1.35;
      opacity: 0.78;
    }

    #status {
      font-size: 12px;
      line-height: 1.4;
      white-space: pre-wrap;
      border: 1px solid #666;
      border-radius: 8px;
      padding: 10px;
      min-height: 130px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <div class="section">
    <div class="row">
      <label>
        packName
        <input id="packNameInput" type="text" placeholder="Например: atlas" />
      </label>
      <label>
        atlasBasePath
        <input id="atlasBasePathInput" type="text" placeholder="./assets/atlases/" />
      </label>
    </div>

    <label>
      serverUrl
      <input id="serverUrlInput" type="text" placeholder="http://localhost:3456" />
    </label>
  </div>

  <div class="section">
    <div class="pathBlock">
      <button id="chooseAtlasOutputDir" type="button">Задать путь экспорта atlas</button>
      <div id="atlasOutputDirPreview" class="pathPreview" title="">Путь atlas не задан</div>
    </div>

    <div class="pathBlock">
      <button id="chooseTsOutputDir" type="button">Задать путь экспорта TS</button>
      <div id="tsOutputDirPreview" class="pathPreview" title="">Путь TS не задан</div>
    </div>
  </div>

  <div class="row">
    <button id="syncToGame" disabled>Экспортировать файлы</button>
    <button id="retry">Повторить экспорт из Figma</button>
    <button id="close">Закрыть</button>
  </div>

  <div id="status">Ожидание данных из Figma...</div>

  <script>
    const DEFAULT_ATLAS_BASE_PATH = "./assets/atlases/";
    const DEFAULT_SERVER_URL = "http://localhost:3456";
    const DEFAULT_ATLAS_OUTPUT_DIR = "/Users/sergeytokarev/work_my/YOUR_GAME_PROJECT/public/assets/atlases";
    const DEFAULT_TS_OUTPUT_DIR = "/Users/sergeytokarev/work_my/YOUR_GAME_PROJECT/src/autogen";

    let exportPayload = null;
    let settings = {
      packName: "",
      atlasBasePath: DEFAULT_ATLAS_BASE_PATH,
      serverUrl: DEFAULT_SERVER_URL,
      atlasOutputDir: DEFAULT_ATLAS_OUTPUT_DIR,
      tsOutputDir: DEFAULT_TS_OUTPUT_DIR,
    };

    const packNameInput = document.getElementById("packNameInput");
    const atlasBasePathInput = document.getElementById("atlasBasePathInput");
    const serverUrlInput = document.getElementById("serverUrlInput");
    const chooseAtlasOutputDirButton = document.getElementById("chooseAtlasOutputDir");
    const chooseTsOutputDirButton = document.getElementById("chooseTsOutputDir");
    const atlasOutputDirPreview = document.getElementById("atlasOutputDirPreview");
    const tsOutputDirPreview = document.getElementById("tsOutputDirPreview");
    const syncToGameButton = document.getElementById("syncToGame");
    const retryButton = document.getElementById("retry");
    const closeButton = document.getElementById("close");
    const statusNode = document.getElementById("status");
    const statusLogLines = [];

    function postToPlugin(message) {
      parent.postMessage({ pluginMessage: message }, "*");
    }

    function setStatus(text) {
      statusNode.textContent = String(text || "");
      if (statusLogLines.length > 0) {
        statusNode.textContent += `\n\nЛог:\n${statusLogLines.join("\n")}`;
      }
      statusNode.scrollTop = statusNode.scrollHeight;
    }

    function appendLog(text) {
      const value = String(text || "").trim();
      if (!value) return;
      statusLogLines.push(value);
      if (statusLogLines.length > 80) statusLogLines.shift();
      setStatus(statusNode.textContent.split("\n\nЛог:\n")[0] || "");
    }

    function slugify(input) {
      const value = String(input || "")
        .normalize("NFKD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-zA-Z0-9._-]+/g, "-")
        .replace(/-+/g, "-")
        .replace(/^-|-$/g, "")
        .toLowerCase();
      return value || "pack";
    }

    function normalizeServerUrl(input) {
      return String(input || "").trim().replace(/\/+$/g, "") || DEFAULT_SERVER_URL;
    }

    function normalizeAtlasBasePath(input) {
      const raw = String(input || "").trim();
      let next = (raw || DEFAULT_ATLAS_BASE_PATH).replace(/\\/g, "/");

      if (!next.startsWith("./") && !next.startsWith("../")) {
        next = next.startsWith("/") ? `.${next}` : `./${next}`;
      }

      if (!next.endsWith("/")) next += "/";
      return next;
    }

    function normalizeDirectoryPath(input) {
      return String(input || "").trim().replace(/\/+$/g, "");
    }

    function updatePathPreview(node, pathValue, emptyText) {
      const value = normalizeDirectoryPath(pathValue);
      node.textContent = value || emptyText;
      node.title = value || "";
    }

    function renderSettings() {
      packNameInput.value = settings.packName || "";
      atlasBasePathInput.value = settings.atlasBasePath || DEFAULT_ATLAS_BASE_PATH;
      serverUrlInput.value = settings.serverUrl || DEFAULT_SERVER_URL;
      updatePathPreview(atlasOutputDirPreview, settings.atlasOutputDir, "Путь atlas не задан");
      updatePathPreview(tsOutputDirPreview, settings.tsOutputDir, "Путь TS не задан");
    }

    function collectSettingsFromUi() {
      settings = {
        ...settings,
        packName: slugify(packNameInput.value || settings.packName || (exportPayload && exportPayload.packName) || "pack"),
        atlasBasePath: normalizeAtlasBasePath(atlasBasePathInput.value),
        serverUrl: normalizeServerUrl(serverUrlInput.value),
        atlasOutputDir: normalizeDirectoryPath(settings.atlasOutputDir),
        tsOutputDir: normalizeDirectoryPath(settings.tsOutputDir),
      };
      renderSettings();
      return settings;
    }

    function savePluginSettings() {
      postToPlugin({
        type: "SAVE_SETTINGS",
        settings: collectSettingsFromUi(),
      });
    }

    async function fetchServerSettings() {
      const serverUrl = normalizeServerUrl(serverUrlInput.value || settings.serverUrl);
      const response = await fetch(`${serverUrl}/settings`);
      const payload = await response.json();
      if (!response.ok || !payload || payload.ok === false) {
        throw new Error(payload && payload.error ? payload.error : `HTTP ${response.status}`);
      }

      settings = {
        ...settings,
        ...payload.settings,
        serverUrl,
      };
      renderSettings();
      savePluginSettings();
    }

    async function saveServerSettings() {
      const nextSettings = collectSettingsFromUi();
      const response = await fetch(`${nextSettings.serverUrl}/settings`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          atlasOutputDir: nextSettings.atlasOutputDir,
          tsOutputDir: nextSettings.tsOutputDir,
        }),
      });
      const payload = await response.json();
      if (!response.ok || !payload || payload.ok === false) {
        throw new Error(payload && payload.error ? payload.error : `HTTP ${response.status}`);
      }
      settings = { ...settings, ...payload.settings };
      renderSettings();
    }

    function promptForDirectory(kind) {
      const isAtlas = kind === "atlas";
      const current = isAtlas ? settings.atlasOutputDir : settings.tsOutputDir;
      const label = isAtlas ? "atlas PNG/JSON" : "TypeScript";
      const value = window.prompt(`Укажи абсолютный путь для экспорта ${label}:`, current || "");
      if (value === null) return;

      const normalized = normalizeDirectoryPath(value);
      if (!normalized) {
        setStatus(`Путь экспорта ${label} не изменен: пустое значение.`);
        return;
      }

      if (isAtlas) {
        settings.atlasOutputDir = normalized;
      } else {
        settings.tsOutputDir = normalized;
      }

      renderSettings();
      savePluginSettings();
      saveServerSettings()
        .then(() => setStatus(`Путь экспорта ${label} сохранен.\n${normalized}`))
        .catch((error) => {
          const message = error instanceof Error ? error.message : String(error);
          setStatus(`Путь сохранен в Figma, но server settings не обновлены:\n${message}`);
        });
    }

    function getUnsafeNameWarningsFromPayload(payload) {
      if (!payload || !payload.manifest || !payload.manifest.warnings) return [];
      const warnings = payload.manifest.warnings.unsafeNames;
      return Array.isArray(warnings) ? warnings : [];
    }

    function formatUnsafeNameWarningsForStatus(warnings) {
      return warnings.map((warning) => {
        const invalidCharacters = Array.isArray(warning.invalidCharacters)
          ? warning.invalidCharacters.map((char) => JSON.stringify(char)).join(", ")
          : "";
        const suffix = invalidCharacters ? ` (${invalidCharacters})` : "";
        return `- ${warning.role}: "${warning.name}" -> "${warning.safeName}"${suffix}`;
      }).join("\n");
    }

    function toBase64FromBytes(bytes) {
      let binary = "";
      const chunkSize = 0x8000;
      for (let offset = 0; offset < bytes.length; offset += chunkSize) {
        const chunk = bytes.subarray(offset, offset + chunkSize);
        binary += String.fromCharCode(...chunk);
      }
      return btoa(binary);
    }

    async function syncToGame() {
      if (!exportPayload) {
        setStatus("Нет данных для экспорта. Сначала выполните экспорт из Figma.");
        return;
      }

      const nextSettings = collectSettingsFromUi();
      if (!nextSettings.atlasOutputDir || !nextSettings.tsOutputDir) {
        setStatus("Задай пути экспорта atlas и TS перед экспортом файлов.");
        return;
      }

      syncToGameButton.disabled = true;
      const startedAt = Date.now();

      try {
        savePluginSettings();
        await saveServerSettings();
        setStatus(`Отправка экспорта в companion server...\n${nextSettings.serverUrl}`);

        const response = await fetch(`${nextSettings.serverUrl}/export`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            packName: nextSettings.packName,
            atlasBasePath: nextSettings.atlasBasePath,
            atlasOutputDir: nextSettings.atlasOutputDir,
            tsOutputDir: nextSettings.tsOutputDir,
            manifest: {
              ...exportPayload.manifest,
              packName: nextSettings.packName,
            },
            files: exportPayload.files.map((file) => ({
              fileName: file.fileName,
              bytesBase64: toBase64FromBytes(file.bytes),
            })),
          }),
        });

        const responseText = await response.text();
        let responseJson = null;
        try {
          responseJson = responseText ? JSON.parse(responseText) : null;
        } catch (error) {
          responseJson = null;
        }

        if (!response.ok || !responseJson || responseJson.ok === false) {
          const serverMessage = responseJson && responseJson.error
            ? responseJson.error
            : responseText || `HTTP ${response.status}`;
          throw new Error(serverMessage);
        }

        const seconds = ((Date.now() - startedAt) / 1000).toFixed(1);
        setStatus(
          `Готово. Файлы экспортированы.\n` +
          `Pack: ${responseJson.packName}\n` +
          `Atlas: ${responseJson.atlasOutputDir}\n` +
          `TS: ${responseJson.tsOutputDir}\n` +
          `Записано файлов: ${responseJson.filesWritten.length}\n` +
          `Время: ${seconds} сек.`,
        );
        postToPlugin({ type: "EXPORT_DONE" });
      } catch (error) {
        const message = error instanceof Error ? error.message : String(error);
        setStatus(`Ошибка экспорта файлов:\n${message}`);
        postToPlugin({ type: "EXPORT_ERROR", message });
      } finally {
        syncToGameButton.disabled = false;
      }
    }

    window.onmessage = (event) => {
      const msg = event.data && event.data.pluginMessage;
      if (!msg || typeof msg !== "object") return;

      if (msg.type === "SETTINGS_LOADED") {
        settings = {
          ...settings,
          ...(msg.settings || {}),
        };
        renderSettings();
        fetchServerSettings().catch((error) => {
          const message = error instanceof Error ? error.message : String(error);
          appendLog(`WARN: server settings недоступны: ${message}`);
        });
        return;
      }

      if (msg.type === "SETTINGS_LOAD_FAILED" || msg.type === "SETTINGS_SAVE_FAILED") {
        appendLog(`WARN: ${msg.message || "ошибка настроек"}`);
        return;
      }

      if (msg.type === "EXPORT_PROGRESS") {
        const done = Number(msg.done || 0);
        const total = Number(msg.total || 0);
        const currentName = msg.currentName ? `\nТекущий узел: ${msg.currentName}` : "";
        setStatus(`Экспорт PNG из Figma... ${done}/${total}${currentName}`);
        return;
      }

      if (msg.type === "EXPORT_READY") {
        exportPayload = msg;
        settings.packName = settings.packName || slugify(msg.packName || "pack");
        renderSettings();
        syncToGameButton.disabled = false;

        const unsafeNameWarnings = getUnsafeNameWarningsFromPayload(msg);
        const unsafeNameWarningText = unsafeNameWarnings.length > 0
          ? `\n\nПредупреждения по именам:\n${formatUnsafeNameWarningsForStatus(unsafeNameWarnings)}`
          : "";

        setStatus(
          `Экспорт из Figma готов.\n` +
          `Pack: ${settings.packName}\n` +
          `PNG файлов: ${msg.files.length}\n` +
          `Atlas path: ${settings.atlasOutputDir || "не задан"}\n` +
          `TS path: ${settings.tsOutputDir || "не задан"}\n` +
          `Нажмите "Экспортировать файлы".` +
          unsafeNameWarningText,
        );
        return;
      }

      if (msg.type === "EXPORT_FAILED") {
        syncToGameButton.disabled = true;
        setStatus(`Ошибка экспорта из Figma:\n${msg.message || "Неизвестная ошибка"}`);
        return;
      }

      if (msg.type === "LOG") {
        const level = String(msg.level || "info").toUpperCase();
        const at = msg.atIso ? `[${msg.atIso}] ` : "";
        appendLog(`${at}${level}: ${String(msg.message || "")}`);
      }
    };

    packNameInput.addEventListener("change", savePluginSettings);
    atlasBasePathInput.addEventListener("change", savePluginSettings);
    serverUrlInput.addEventListener("change", () => {
      savePluginSettings();
      fetchServerSettings().catch((error) => {
        const message = error instanceof Error ? error.message : String(error);
        setStatus(`Server settings недоступны:\n${message}`);
      });
    });
    chooseAtlasOutputDirButton.addEventListener("click", () => promptForDirectory("atlas"));
    chooseTsOutputDirButton.addEventListener("click", () => promptForDirectory("ts"));
    syncToGameButton.addEventListener("click", syncToGame);
    retryButton.addEventListener("click", () => {
      syncToGameButton.disabled = true;
      setStatus("Повторный экспорт из Figma...");
      postToPlugin({ type: "RETRY_EXPORT" });
    });
    closeButton.addEventListener("click", () => postToPlugin({ type: "CLOSE" }));

    renderSettings();
    postToPlugin({ type: "GET_SETTINGS" });
  </script>
</body>
</html>
